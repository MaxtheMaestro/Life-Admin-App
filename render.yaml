services:
  - type: web
    name: life-admin
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ALLOWED_HOSTS
        value: life-admin-2wtl.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://life-admin-2wtl.onrender.com
      - key: AUTH_RATE_LIMIT_ATTEMPTS
        value: 5
